<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800">
  <title>Sathmi Peiris – Kawaii Robot x High-Energy Physics</title>
  <desc>Animated banner with a kawaii robot, spinning ATLAS atom, sakura petals and Japanese text</desc>

  <!-- background -->
  <rect width="800" height="220" rx="18" fill="#f0fafa"/>

  <!-- grid dot decoration left -->
  <g fill="#00ADB5" opacity="0.07">
    <circle cx="30"  cy="30"  r="2"/><circle cx="70"  cy="30"  r="2"/><circle cx="110" cy="30"  r="2"/><circle cx="150" cy="30"  r="2"/><circle cx="190" cy="30"  r="2"/>
    <circle cx="30"  cy="70"  r="2"/><circle cx="70"  cy="70"  r="2"/><circle cx="110" cy="70"  r="2"/><circle cx="150" cy="70"  r="2"/><circle cx="190" cy="70"  r="2"/>
    <circle cx="30"  cy="110" r="2"/><circle cx="70"  cy="110" r="2"/><circle cx="110" cy="110" r="2"/><circle cx="150" cy="110" r="2"/><circle cx="190" cy="110" r="2"/>
  </g>
  <!-- grid dot decoration right -->
  <g fill="#00ADB5" opacity="0.07">
    <circle cx="610" cy="30"  r="2"/><circle cx="650" cy="30"  r="2"/><circle cx="690" cy="30"  r="2"/><circle cx="730" cy="30"  r="2"/><circle cx="770" cy="30"  r="2"/>
    <circle cx="610" cy="70"  r="2"/><circle cx="650" cy="70"  r="2"/><circle cx="690" cy="70"  r="2"/><circle cx="730" cy="70"  r="2"/><circle cx="770" cy="70"  r="2"/>
    <circle cx="610" cy="110" r="2"/><circle cx="650" cy="110" r="2"/><circle cx="690" cy="110" r="2"/><circle cx="730" cy="110" r="2"/><circle cx="770" cy="110" r="2"/>
  </g>

  <!-- ═══ SAKURA PETALS ═══ -->
  <ellipse cx="120" cy="30" rx="6" ry="3" fill="#FFB7C5" transform="rotate(-30,120,30)">
    <animateTransform attributeName="transform" type="translate" values="0,0;8,160;0,0" dur="6s" repeatCount="indefinite" additive="sum"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="280" cy="10" rx="5" ry="2.5" fill="#FFB7C5" transform="rotate(20,280,10)">
    <animateTransform attributeName="transform" type="translate" values="0,0;-12,180;0,0" dur="8s" begin="1.5s" repeatCount="indefinite" additive="sum"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="8s" begin="1.5s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="500" cy="15" rx="5" ry="2.5" fill="#FFB7C5" transform="rotate(45,500,15)">
    <animateTransform attributeName="transform" type="translate" values="0,0;5,170;0,0" dur="7s" begin="3s" repeatCount="indefinite" additive="sum"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="7s" begin="3s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="650" cy="20" rx="4" ry="2" fill="#FFB7C5" transform="rotate(-15,650,20)">
    <animateTransform attributeName="transform" type="translate" values="0,0;-8,175;0,0" dur="9s" begin="0.5s" repeatCount="indefinite" additive="sum"/>
    <animate attributeName="opacity" values="0;0.65;0" dur="9s" begin="0.5s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="380" cy="5" rx="5" ry="2.5" fill="#ee93b1" transform="rotate(60,380,5)">
    <animateTransform attributeName="transform" type="translate" values="0,0;10,190;0,0" dur="10s" begin="2s" repeatCount="indefinite" additive="sum"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="10s" begin="2s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="60" cy="5" rx="4" ry="2" fill="#FFB7C5" transform="rotate(30,60,5)">
    <animateTransform attributeName="transform" type="translate" values="0,0;15,185;0,0" dur="7.5s" begin="4s" repeatCount="indefinite" additive="sum"/>
    <animate attributeName="opacity" values="0;0.75;0" dur="7.5s" begin="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ═══ KAWAII ROBOT ═══ -->
  <g transform="translate(170,108)">

    <!-- body bob -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="2.4s" repeatCount="indefinite"/>

      <!-- shadow -->
      <ellipse cx="0" cy="100" rx="30" ry="5" fill="#00ADB5" opacity="0.10">
        <animate attributeName="rx" values="30;26;30" dur="2.4s" repeatCount="indefinite"/>
      </ellipse>

      <!-- antenna pole -->
      <line x1="0" y1="-80" x2="0" y2="-66" stroke="#00ADB5" stroke-width="2.5" stroke-linecap="round"/>
      <!-- antenna ball -->
      <circle cx="0" cy="-84" r="5.5" fill="#FFB7C5" stroke="#cc6b8a" stroke-width="1.5"/>
      <!-- antenna sparkle -->
      <circle cx="0" cy="-84" r="3" fill="white">
        <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;1;3" dur="1.2s" repeatCount="indefinite"/>
      </circle>

      <!-- HEAD -->
      <rect x="-30" y="-65" width="60" height="46" rx="13" fill="white" stroke="#00ADB5" stroke-width="2"/>

      <!-- left eye base -->
      <circle cx="-13" cy="-44" r="9" fill="#00ADB5"/>
      <circle cx="-11" cy="-47" r="3.5" fill="white"/>
      <!-- left eye blink cover -->
      <rect x="-22" y="-54" width="18" height="20" rx="9" fill="white">
        <animate attributeName="height" values="1;1;1;20;1;1" dur="4s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-44;-44;-44;-54;-44;-44" dur="4s" begin="0.5s" repeatCount="indefinite"/>
      </rect>

      <!-- right eye base -->
      <circle cx="13" cy="-44" r="9" fill="#00ADB5"/>
      <circle cx="15" cy="-47" r="3.5" fill="white"/>
      <!-- right eye blink cover -->
      <rect x="4" y="-54" width="18" height="20" rx="9" fill="white">
        <animate attributeName="height" values="1;1;1;20;1;1" dur="4s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-44;-44;-44;-54;-44;-44" dur="4s" begin="0.5s" repeatCount="indefinite"/>
      </rect>

      <!-- blush left -->
      <ellipse cx="-24" cy="-37" rx="5.5" ry="3" fill="#FFB7C5" opacity="0.75"/>
      <!-- blush right -->
      <ellipse cx="24" cy="-37" rx="5.5" ry="3" fill="#FFB7C5" opacity="0.75"/>

      <!-- smile -->
      <path d="M-11,-28 Q0,-21 11,-28" stroke="#00ADB5" stroke-width="2.2" fill="none" stroke-linecap="round"/>

      <!-- BODY -->
      <rect x="-28" y="-17" width="56" height="45" rx="11" fill="#e0fafa" stroke="#00ADB5" stroke-width="2"/>

      <!-- chest panel -->
      <rect x="-17" y="-11" width="34" height="25" rx="7" fill="white" stroke="#00ADB5" stroke-width="1.2"/>

      <!-- left chest light -->
      <circle cx="-7" cy="-2" r="5" fill="#FFB7C5">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <!-- right chest light -->
      <circle cx="7" cy="-2" r="5" fill="#00ADB5">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" repeatCount="indefinite"/>
      </circle>

      <!-- LEFT arm (static) -->
      <rect x="-44" y="-15" width="14" height="30" rx="7" fill="#e0fafa" stroke="#00ADB5" stroke-width="1.5"/>
      <circle cx="-37" cy="17" r="6.5" fill="white" stroke="#00ADB5" stroke-width="1.5"/>

      <!-- RIGHT arm (waves) using animateTransform rotate around shoulder pivot -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0,28,-12;-32,28,-12;6,28,-12;0,28,-12" dur="2.4s" repeatCount="indefinite"/>
        <rect x="30" y="-15" width="14" height="30" rx="7" fill="#e0fafa" stroke="#00ADB5" stroke-width="1.5"/>
        <circle cx="37" cy="17" r="6.5" fill="white" stroke="#00ADB5" stroke-width="1.5"/>
      </g>

      <!-- left leg -->
      <rect x="-22" y="29" width="16" height="22" rx="8" fill="#e0fafa" stroke="#00ADB5" stroke-width="1.5"/>
      <!-- right leg -->
      <rect x="6"  y="29" width="16" height="22" rx="8" fill="#e0fafa" stroke="#00ADB5" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ═══ CENTER TEXT ═══ -->
  <text x="400" y="72" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="23" font-weight="700" fill="#1a2a2a" letter-spacing="-0.3">Sathmi Peiris</text>
  <text x="400" y="97" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#00ADB5" letter-spacing="0.4">Computer Engineering · Robotics · HEP</text>
  <text x="400" y="118" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#cc6b8a">ロボット工学 × 高エネルギー物理学 ✿</text>

  <!-- divider dots -->
  <circle cx="358" cy="133" r="2.5" fill="#00ADB5" opacity="0.4"/>
  <circle cx="400" cy="133" r="2.5" fill="#FFB7C5" opacity="0.6"/>
  <circle cx="442" cy="133" r="2.5" fill="#00ADB5" opacity="0.4"/>

  <!-- badge: ROS2 -->
  <rect x="289" y="144" width="84" height="23" rx="11.5" fill="#e0fafa" stroke="#00ADB5" stroke-width="1"/>
  <text x="331" y="159.5" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#0f6e56">ROS2 · Jetson</text>

  <!-- badge: ATLAS -->
  <rect x="383" y="144" width="84" height="23" rx="11.5" fill="#ffe4ed" stroke="#cc6b8a" stroke-width="1"/>
  <text x="425" y="159.5" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#993556">ATLAS · CERN</text>

  <!-- badge: languages -->
  <rect x="337" y="174" width="90" height="23" rx="11.5" fill="#f0ebff" stroke="#7f77dd" stroke-width="1"/>
  <text x="382" y="189.5" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#3c3489">6 languages ✿</text>

  <!-- ═══ ATOM (right side) ═══ -->
  <g transform="translate(622,108)">

    <!-- nucleus pulse -->
    <circle cx="0" cy="0" r="14" fill="#FFB7C5" stroke="#cc6b8a" stroke-width="1.5">
      <animate attributeName="r" values="14;17;14" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- proton -->
    <circle cx="-5" cy="-4" r="4.5" fill="#e24b4a" opacity="0.85"/>
    <!-- neutron -->
    <circle cx="5" cy="3" r="4" fill="#185fa5" opacity="0.85"/>
    <!-- extra nucleon -->
    <circle cx="0" cy="-6" r="3.5" fill="#cc6b8a" opacity="0.75"/>

    <!-- ORBIT 1 — teal, 4s -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0,0,0;360,0,0" dur="4s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="58" ry="22" fill="none" stroke="#00ADB5" stroke-width="1.3" opacity="0.55"/>
      <circle cx="58" cy="0" r="5.5" fill="#00ADB5"/>
    </g>

    <!-- ORBIT 2 — pink, 6s, rotated 60deg -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="60,0,0;420,0,0" dur="6s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="58" ry="22" fill="none" stroke="#FFB7C5" stroke-width="1.3" opacity="0.55"/>
      <circle cx="58" cy="0" r="5.5" fill="#FFB7C5"/>
    </g>

    <!-- ORBIT 3 — blue, 8s, rotated 120deg -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="120,0,0;480,0,0" dur="8s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="58" ry="22" fill="none" stroke="#185fa5" stroke-width="1.3" opacity="0.55"/>
      <circle cx="58" cy="0" r="5.5" fill="#185fa5"/>
    </g>

    <!-- energy sparks -->
    <circle cx="0" cy="-20" r="3" fill="#FFB7C5">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="17" cy="11" r="2.5" fill="#00ADB5">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-17" cy="11" r="2.5" fill="#185fa5">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- bottom wave decoration -->
  <path d="M0,205 Q100,196 200,205 Q300,214 400,205 Q500,196 600,205 Q700,214 800,205 L800,220 L0,220 Z" fill="#00ADB5" opacity="0.11"/>
  <path d="M0,212 Q100,206 200,212 Q300,218 400,212 Q500,206 600,212 Q700,218 800,212 L800,220 L0,220 Z" fill="#FFB7C5" opacity="0.14"/>

</svg>
